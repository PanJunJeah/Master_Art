# ===== 测试专用配置：H2 内存数据库（无需本地 MySQL）=====
spring.datasource.url=jdbc:h2:mem:masterart_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Spring AI 上下文加载所需（单元测试不真正调用 DeepSeek）
spring.ai.openai.api-key=test-key-not-used
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-chat
spring.ai.openai.chat.options.temperature=0.2

# Agent 参数
agent.max-tool-steps=6
agent.draft-ttl-minutes=30
agent.rag.timeout-ms=2500
agent.rag.top-k=5
agent.chat-memory.max-messages=20

# 旧版聊天接口兼容
ai.api.url=https://api.deepseek.com/chat/completions
ai.api.key=test-key-not-used
ai.api.model=deepseek-chat
