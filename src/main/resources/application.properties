# 服务器配置
server.port=8080

# 数据库配置（可用环境变量 DB_URL / DB_USERNAME / DB_PASSWORD 覆盖）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/master_art?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置（方言由 Hibernate 6 自动探测，无需显式指定）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 日志配置
logging.level.com.pan.master_art=debug
logging.level.org.springframework.web=info
logging.level.org.hibernate=error

# ================= Spring AI / DeepSeek（Agent 编排层） =================
# ⚠️ 安全：API Key 不写入仓库！请通过环境变量 AI_API_KEY 注入
#    - PowerShell（当前会话）: $env:AI_API_KEY="sk-xxxx"
#    - PowerShell（永久）    : setx AI_API_KEY "sk-xxxx"
#    - IntelliJ IDEA         : Run Configuration -> Environment variables 增加 AI_API_KEY
#    - Linux / macOS         : export AI_API_KEY="sk-xxxx"
# 未配置时应用仍可正常启动（浏览/管理功能可用），AI 相关接口会返回友好降级提示。
spring.ai.openai.api-key=${AI_API_KEY:not-configured}
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=${AI_MODEL:deepseek-chat}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=2048

# ---------- Agent 编排与安全边界参数 ----------
# 单次对话最大工具调用步数（防止模型死循环）
agent.max-tool-steps=6
# 预约草稿有效期（分钟），超时未确认自动过期
agent.draft-ttl-minutes=30
# RAG 知识检索超时（毫秒），超时后降级为友好提示
agent.rag.timeout-ms=2500
# RAG 检索返回条数
agent.rag.top-k=5
# 对话记忆保留的消息条数
agent.chat-memory.max-messages=20

# ---------- 旧版纯聊天接口（保留兼容，Key 同样来自环境变量） ----------
ai.api.url=https://api.deepseek.com/chat/completions
ai.api.key=${AI_API_KEY:not-configured}
ai.api.model=deepseek-chat
